<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SatVantage Copiloto</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="sv-head">
      <img
        class="sv-head-logo"
        src="icons/SatVantagelogoq.png"
        width="36"
        height="36"
        alt="SatVantage"
      />
      <div class="sv-head-text">
        <strong>SatVantage Copiloto</strong>
        <p id="head-sub">Ajuda rápida sobre Bitcoin e segurança nesta página.</p>
      </div>
    </header>

    <div id="page-url-wrap" class="sv-url-wrap" hidden>
      <span id="page-url-badge" class="sv-url-badge" hidden>Site oficial</span>
      <p id="page-url" class="sv-url" title=""></p>
    </div>

    <section id="btc-card" class="sv-btc" hidden>
      <p class="sv-btc-label">Bitcoin (CoinGecko)</p>
      <p id="btc-price" class="sv-btc-price">—</p>
      <p id="btc-meta" class="sv-btc-meta"></p>
    </section>

    <label class="sv-label" for="pergunta">Sua pergunta <span class="sv-optional">(opcional)</span></label>
    <textarea
      id="pergunta"
      rows="3"
      placeholder="Deixe em branco para um resumo de onde você está, ou pergunte algo…"
    ></textarea>

    <div class="sv-suggestions" role="group" aria-label="Sugestões">
      <button type="button" class="sv-chip" data-q="Isso é golpe?">Isso é golpe?</button>
      <button type="button" class="sv-chip" data-q="Qual o preço do Bitcoin?">
        Qual o preço do Bitcoin?
      </button>
      <button type="button" class="sv-chip" data-q="Como crio uma carteira aqui?">
        Como crio uma carteira aqui?
      </button>
    </div>

    <div class="sv-actions">
      <button type="button" id="enviar" class="sv-btn">Analisar página</button>
      <button type="button" id="btn-btc" class="sv-btn sv-btn--ghost">Preço do Bitcoin</button>
      <button type="button" id="capturar" class="sv-btn sv-btn--ghost">
        📷 Selecionar área da tela
      </button>
    </div>

    <div id="crop" class="sv-crop" hidden>
      <p class="sv-crop-hint">
        Arraste na imagem para marcar a área. Depois confirme a análise.
      </p>
      <div id="crop-stage" class="sv-crop-stage">
        <img id="crop-img" alt="Captura da aba" />
        <div id="crop-rect" class="sv-crop-rect"></div>
      </div>
      <div class="sv-crop-actions">
        <button type="button" id="crop-ok" class="sv-btn" disabled>Analisar área</button>
        <button type="button" id="crop-cancel" class="sv-btn sv-btn--ghost">Cancelar</button>
      </div>
    </div>

    <p id="status" class="sv-status" hidden></p>

    <section id="resultado" class="sv-result" hidden>
      <p id="result-url" class="sv-result-url" hidden></p>
      <div id="badge" class="sv-badge" hidden></div>
      <div id="risco" class="sv-risco" hidden></div>
      <p id="explicacao" class="sv-explicacao"></p>
      <p id="passos-title" class="sv-passos-title">Próximos passos</p>
      <ol id="passos" class="sv-passos"></ol>
    </section>

    <footer class="sv-foot">
      Envia URL, texto/imagem da página e a pergunta (se houver) ao backend SatVantage.
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
